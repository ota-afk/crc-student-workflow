name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest

  # The plan's end-to-end test: a real server, real HTTP calls, the whole demo path.
  e2e:
    runs-on: ubuntu-latest
    env:
      # A throwaway value for this CI server only, never used anywhere else. It makes the
      # smoke test check that requests without the key are refused, as on the live API.
      API_KEY: ci-only-throwaway-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Start the API in the background
        # The trailing & keeps it running for the next steps; its output goes to a log file.
        run: uv run --locked uvicorn student_workflow.api:app --port 8000 > uvicorn.log 2>&1 &
        env:
          USE_MOCK: "false"
      - name: Smoke test the running API
        run: uv run --locked python scripts/smoke_test.py
        env:
          API_URL: http://localhost:8000
      - name: Show the server log
        if: failure()
        run: cat uvicorn.log
